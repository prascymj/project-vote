<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>การโหวตปิดแล้ว — RAISE-2</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --ink: #1e293b; --muted: #64748b;
    --line: #e2e8f0; --brand: #4f46e5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", Tahoma, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.6;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px 14px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 44px 32px; max-width: 480px; width: 100%; text-align: center;
    box-shadow: 0 8px 30px rgba(15,23,42,.08);
  }
  .icon { font-size: 3.4rem; margin-bottom: 8px; }
  h1 { font-size: 1.5rem; margin: 10px 0 6px; }
  p { color: var(--muted); margin: 8px 0; font-size: 1rem; }
  .badge {
    display: inline-block; margin-top: 18px; padding: 8px 18px;
    background: #eef2ff; color: var(--brand); border-radius: 999px;
    font-weight: 700; font-size: .9rem;
  }
  .note { margin-top: 22px; font-size: .85rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 18px; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🗳️✅</div>
    <h1>การโหวตปิดแล้ว</h1>
    <p>ขอบคุณทุกคนที่ร่วมโหวตในงานเปิดโครงการ RAISE-2</p>
    <p>ระบบได้บันทึกคะแนนเรียบร้อยแล้ว</p>
    <div class="badge">พบกันอีกครั้งตอนปิดโครงการ</div>
    <p class="note">The vote for the opening event is now closed.<br>Voting will reopen at the project closing event.</p>
  </div>
</body>
</html>
